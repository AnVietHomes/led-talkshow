<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkshow Admin Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manrope', sans-serif; background: #f4f7f6; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .admin-panel { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 600px; }
        h2 { color: #2c3e50; margin-top: 0; }
        textarea { width: 100%; height: 120px; padding: 15px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 20px; resize: none; box-sizing: border-box; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { padding: 15px; font-size: 15px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        
        .btn-push { background: #0056b3; color: white; grid-column: span 2; font-size: 18px; }
        .btn-push:hover { background: #004494; }
        
        .btn-notif { background: #f39c12; color: white; }
        .btn-notif:hover { background: #d35400; }
        
        .btn-clear { background: #e74c3c; color: white; }
        .btn-clear:hover { background: #c0392b; }
        
        .status { margin-top: 15px; color: #27ae60; font-weight: 700; font-size: 14px; text-align: center; }
        .hint { font-size: 12px; color: #7f8c8d; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="admin-panel">
        <h2>Talkshow Control Panel</h2>
        <textarea id="question-input" placeholder="Nhập nội dung câu hỏi..."></textarea>
        
        <div class="btn-group">
            <button class="btn-push" onclick="sendQuestion()">HIỆN CÂU HỎI TRÊN LED</button>
            <button class="btn-notif" onclick="sendNotification()">GỬI THÔNG BÁO MỚI</button>
            <button class="btn-clear" onclick="clearScreen()">ẨN KHUNG CÂU HỎI</button>
        </div>
        
        <p class="hint">* Nút "Gửi thông báo mới" sẽ hiện popup 5 giây ở góc trái màn LED.</p>
        <div class="status" id="status-msg"></div>
    </div>

    <script>
        const channel = new BroadcastChannel('talkshow_channel');
        const statusMsg = document.getElementById('status-msg');

        function sendQuestion() {
            const text = document.getElementById('question-input').value.trim();
            if(text) {
                channel.postMessage(text);
                showStatus("Đã gửi câu hỏi!");
            } else {
                alert("Hãy nhập chữ trước khi gửi!");
            }
        }

        function sendNotification() {
            channel.postMessage("CMD_SHOW_NOTIFICATION");
            showStatus("Đã kích hoạt popup thông báo!");
        }

        function clearScreen() {
            channel.postMessage("");
            showStatus("Đã xóa màn hình.");
        }

        function showStatus(msg) {
            statusMsg.innerText = msg;
            setTimeout(() => { statusMsg.innerText = ""; }, 3000);
        }
    </script>
</body>
</html>
