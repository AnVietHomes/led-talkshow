<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Display - An Viet Homes</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; display: flex; justify-content: center; 
            align-items: center; overflow: hidden; font-family: 'Manrope', sans-serif; 
        }
        .ratio-16-9 { 
            position: relative; width: 100vw; max-width: calc(100vh * (16 / 9)); 
            height: 100vh; max-height: calc(100vw * (9 / 16)); background: #000; overflow: hidden; 
        }
        
        #bg-video { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; pointer-events: none; user-select: none; -webkit-user-drag: none; 
        }

        /* POPUP THÔNG BÁO GÓC TRÁI */
        .notif-popup {
            position: absolute; top: 40px; left: 40px; z-index: 10;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px; padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.6);
            opacity: 0; transform: translateX(-50px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        }
        .notif-popup.active { opacity: 1; transform: translateX(0); }
        .notif-icon { width: 30px; height: 30px; background: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .notif-content { color: white; font-size: 1.2vw; font-weight: 500; margin: 0; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* KHUNG CÂU HỎI LIQUID GLASS CHUẨN */
        .question-box {
            position: absolute; top: 60%; left: 50%; z-index: 2;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.06) 100%);
            backdrop-filter: blur(6px) saturate(130%);
            -webkit-backdrop-filter: blur(6px) saturate(130%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.8);
            border-left: 1.5px solid rgba(255, 255, 255, 0.5);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
            border-right: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px; padding: 30px 50px; max-width: 90%; width: fit-content;
            text-align: center; opacity: 0;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35), 0 10px 15px rgba(0, 0, 0, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.7);
            transform: translate(-50%, 30px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: none;
        }
        .question-box.show { display: block; opacity: 1; transform: translate(-50%, 0) scale(1); }
        .question-box.hide { opacity: 0; transform: translate(-50%, -30px) scale(0.95); }
        #question-text { color: #ffffff; font-size: 1.3vw; font-weight: 700; margin: 0; line-height: 1.5; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }

        /* ĐỒNG HỒ ĐẾM NGƯỢC - HIỆU ỨNG LIQUID GLASS TYPOGRAPHY TINH CHỈNH CHUẨN XÁC */
        .timer-display-container {
            position: absolute; top: 35%; left: 50%; z-index: 3;
            text-align: center; opacity: 0;
            transform: translate(-50%, -20px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: none;
            pointer-events: none;
            width: 100%;
        }
        .timer-display-container.show { display: block; opacity: 1; transform: translate(-50%, 0) scale(1); }

        /* Phần text nội dung: Font Manrope mảnh hơn (weight 500), khoảng cách dưới cực ngắn, hiệu ứng kính lỏng chữ tinh tế */
        .timer-custom-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.4vw;
            font-weight: 500; /* Font mảnh tinh tế theo yêu cầu */
            letter-spacing: 3px;
            margin: 0 0 4px 0; /* Co lại khoảng cách cực sát với đồng hồ bên dưới */
            text-transform: uppercase;
            /* Hiệu ứng Liquid Glass Typography trực tiếp trên từng ký tự */
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.85));
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5), 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Số đồng hồ: Size to hơn hẳn (7.5vw), dày dặn, hiệu ứng nổi khối 3D quang học */
        .timer-custom-clock {
            color: #ffffff;
            font-size: 7.5vw; /* Tăng kích thước số to hơn rõ rệt */
            font-weight: 800;
            margin: 0;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 3px;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.95));
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.7), 0 0 30px rgba(94, 234, 212, 0.5);
        }

        /* Text khi hết giờ */
        .timer-custom-ended {
            color: #f43f5e;
            font-size: 3.2vw;
            font-weight: 800;
            margin: 0;
            letter-spacing: 2px;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.95));
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5), 0 0 35px rgba(244, 63, 94, 0.7);
            display: none;
        }
    </style>
</head>
<body>
    <div class="ratio-16-9">
        <video id="bg-video" autoplay loop muted playsinline preload="auto">
            <source src="./bgt.mp4" type="video/mp4">
        </video>

        <div class="notif-popup" id="notif-box">
            <div class="notif-icon">🔔</div>
            <p class="notif-content">Bạn vừa nhận được 01 câu hỏi mới từ người tham gia</p>
        </div>

        <!-- ĐỒNG HỒ ĐẾM NGƯỢC (ĐÃ TỐI ƯU FONT MẢNH, KHOẢNG CÁCH SÁT & HIỆU ỨNG LIQUID GLASS CHỮ) -->
        <div class="timer-display-container" id="timer-display-box">
            <p class="timer-custom-title" id="t-title">CHƯƠNG TRÌNH BẮT ĐẦU SAU</p>
            <p class="timer-custom-clock" id="t-clock">00:00</p>
            <p class="timer-custom-ended" id="t-ended">HẾT GIỜ BẮT ĐẦU!</p>
        </div>

        <!-- KHUNG CÂU HỎI -->
        <div class="question-box" id="q-box">
            <p id="question-text"></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('bg-video');
        video.addEventListener('pause', function() { if (!video.ended) video.play().catch(() => {}); });

        const firebaseConfig = { databaseURL: "https://talkshow-d92b4-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. XỬ LÝ CÂU HỎI & VỊ TRÍ CÂU HỎI
        const qBox = document.getElementById('q-box');
        const qText = document.getElementById('question-text');
        const notifBox = document.getElementById('notif-box');
        let currentTop = 60;

        db.ref('control').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            const action = data.action;
            const msg = data.text !== undefined ? data.text : "";

            if (action === "notification") { triggerNotification(); return; }
            if (action === "move_up") { currentTop -= 2; qBox.style.top = currentTop + "%"; return; }
            if (action === "move_down") { currentTop += 2; qBox.style.top = currentTop + "%"; return; }

            if (msg === "") {
                qBox.classList.remove('show');
                qBox.classList.add('hide');
                setTimeout(() => { qBox.style.display = 'none'; }, 600);
                return;
            }

            if (qBox.classList.contains('show')) {
                qBox.classList.remove('show');
                qBox.classList.add('hide');
                setTimeout(() => {
                    qText.innerText = msg;
                    qBox.classList.remove('hide');
                    qBox.classList.add('show');
                }, 600);
            } else {
                qBox.style.display = 'block';
                qText.innerText = msg;
                setTimeout(() => { qBox.classList.remove('hide'); qBox.classList.add('show'); }, 50);
            }
        });

        function triggerNotification() {
            notifBox.classList.add('active');
            setTimeout(() => { notifBox.classList.remove('active'); }, 5000);
        }

        // 2. XỬ LÝ ĐỒNG HỒ ĐẾM NGƯỢC & VỊ TRÍ ĐỒNG HỒ
        const timerDisplayBox = document.getElementById('timer-display-box');
        const tTitle = document.getElementById('t-title');
        const tClock = document.getElementById('t-clock');
        const tEnded = document.getElementById('t-ended');

        let timerInterval = null;
        let remainingSeconds = 0;
        let configRunningText = "";
        let configEndedText = "";
        let timerTopPos = 35;

        db.ref('timer_control').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const cmd = data.command;
            configRunningText = data.runningText || "CHƯƠNG TRÌNH BẮT ĐẦU SAU";
            configEndedText = data.endedText || "HẾT GIỜ!";

            if (cmd === 'timer_move_up') {
                timerTopPos -= 3;
                timerDisplayBox.style.top = timerTopPos + "%";
                return;
            }
            if (cmd === 'timer_move_down') {
                timerTopPos += 3;
                timerDisplayBox.style.top = timerTopPos + "%";
                return;
            }

            if (cmd === 'start') {
                if (!timerInterval) {
                    if (remainingSeconds <= 0) remainingSeconds = data.duration || 60;
                    startTimer();
                }
            } else if (cmd === 'pause') {
                pauseTimer();
            } else if (cmd === 'reset') {
                pauseTimer();
                remainingSeconds = data.duration || 60;
                updateTimerDisplay();
                tEnded.style.display = 'none';
                tClock.style.display = 'block';
                tTitle.innerText = configRunningText;
                timerDisplayBox.classList.add('show');
            } else if (cmd === 'hide') {
                pauseTimer();
                timerDisplayBox.classList.remove('show');
            }
        });

        function startTimer() {
            timerDisplayBox.style.top = timerTopPos + "%";
            timerDisplayBox.classList.add('show');
            tEnded.style.display = 'none';
            tClock.style.display = 'block';
            tTitle.innerText = configRunningText;

            updateTimerDisplay();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    remainingSeconds = 0;
                    updateTimerDisplay();
                    tClock.style.display = 'none';
                    tEnded.innerText = configEndedText;
                    tEnded.style.display = 'block';
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            tClock.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
