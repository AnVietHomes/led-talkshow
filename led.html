<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Display - An Viet Homes</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            font-family: 'Manrope', sans-serif; 
        }
        
        .ratio-16-9 { 
            position: relative; 
            width: 100vw; 
            max-width: calc(100vh * (16 / 9)); 
            height: 100vh; 
            max-height: calc(100vw * (9 / 16)); 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        #bg-video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* POPUP THÔNG BÁO GÓC TRÁI - Đã ép sát lề hơn */
        .notif-popup {
            position: absolute;
            top: 40px; /* Cố định cách trần 40px */
            left: 40px; /* Cố định cách lề trái 40px */
            z-index: 10;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .notif-popup.active { opacity: 1; transform: translateX(0); }
        .notif-icon { width: 30px; height: 30px; background: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .notif-content { color: white; font-size: 1.2vw; font-weight: 500; margin: 0; }

        /* KHUNG CÂU HỎI CHÍNH */
        .question-box {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px 60px;
            max-width: 80%;
            text-align: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: none;
        }
        
        .question-box.show { display: block; opacity: 1; transform: translateY(0) scale(1); }
        .question-box.hide { opacity: 0; transform: translateY(-30px) scale(0.95); }
        
        /* FONT CHỮ CÂU HỎI - Đã thu nhỏ */
        #question-text { 
            color: #ffffff; 
            font-size: 2.2vw; /* Giảm từ 3.5vw xuống 2.2vw */
            font-weight: 700; 
            margin: 0; 
            line-height: 1.5; 
        }
    </style>
</head>
<body>

    <div class="ratio-16-9">
        <!-- Đã thêm ./ vào đường dẫn src để GitHub Pages nhận diện chính xác -->
        <video id="bg-video" autoplay loop muted playsinline disablePictureInPicture controlsList="nodownload noplaybackrate nofullscreen">
            <source src="./bgt.mp4" type="video/mp4">
        </video>

        <div class="notif-popup" id="notif-box">
            <div class="notif-icon">🔔</div>
            <p class="notif-content">Bạn vừa nhận được 01 câu hỏi mới từ người tham gia</p>
        </div>

        <div class="question-box" id="q-box">
            <p id="question-text"></p>
        </div>
    </div>

    <script>
        const qBox = document.getElementById('q-box');
        const qText = document.getElementById('question-text');
        const notifBox = document.getElementById('notif-box');

        const channel = new BroadcastChannel('talkshow_channel');

        channel.onmessage = (event) => {
            const msg = event.data;

            if (msg === "CMD_SHOW_NOTIFICATION") {
                triggerNotification();
                return;
            }

            if (msg === "") {
                qBox.classList.remove('show');
                qBox.classList.add('hide');
                setTimeout(() => { qBox.style.display = 'none'; }, 600);
                return;
            }

            if (qBox.classList.contains('show')) {
                qBox.classList.remove('show');
                qBox.classList.add('hide');
                setTimeout(() => {
                    qText.innerText = msg;
                    qBox.classList.remove('hide');
                    qBox.classList.add('show');
                }, 600);
            } else {
                qBox.style.display = 'block';
                qText.innerText = msg;
                setTimeout(() => {
                    qBox.classList.remove('hide');
                    qBox.classList.add('show');
                }, 50);
            }
        };

        function triggerNotification() {
            notifBox.classList.add('active');
            setTimeout(() => {
                notifBox.classList.remove('active');
            }, 5000);
        }
        
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
