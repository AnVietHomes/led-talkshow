<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Display - An Viet Homes</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; display: flex; justify-content: center; 
            align-items: center; overflow: hidden; font-family: 'Manrope', sans-serif; 
        }
        .ratio-16-9 { 
            position: relative; width: 100vw; max-width: calc(100vh * (16 / 9)); 
            height: 100vh; max-height: calc(100vw * (9 / 16)); background: #000; overflow: hidden; 
        }
        
        #bg-video { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; pointer-events: none; user-select: none; -webkit-user-drag: none; 
        }

        /* POPUP THÔNG BÁO GÓC TRÁI */
        .notif-popup {
            position: absolute; top: 40px; left: 40px; z-index: 10;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px; padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.6);
            opacity: 0; transform: translateX(-50px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        }
        .notif-popup.active { opacity: 1; transform: translateX(0); }
        .notif-icon { width: 30px; height: 30px; background: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .notif-content { color: white; font-size: 1.2vw; font-weight: 500; margin: 0; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* KHUNG CÂU HỎI - KÍNH TRẮNG MỎNG, BLUR THẤP, HÒA QUYỆN NỀN VIDEO */
        .question-box {
            position: absolute; top: 55%; left: 50%; z-index: 2;
            
            /* Lớp phủ trắng trong suốt tinh tế, giảm thiểu tối đa độ tối và độ mờ */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.06) 100%);
            backdrop-filter: blur(5px) saturate(130%);
            -webkit-backdrop-filter: blur(5px) saturate(130%);
            
            /* Viền bắt sáng trắng sáng bóng chuẩn kính thật 4 cạnh */
            border-top: 2px solid rgba(255, 255, 255, 0.8);
            border-left: 2px solid rgba(255, 255, 255, 0.5);
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            border-right: 2px solid rgba(255, 255, 255, 0.3);
            
            border-radius: 24px; 
            padding: 35px 55px; 
            max-width: 90%; 
            width: fit-content;
            text-align: center; 
            opacity: 0;
            
            /* Đổ bóng nhẹ nhàng, không bị nặng nề */
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.35),       
                0 10px 15px rgba(0, 0, 0, 0.15),       
                inset 0 1px 2px rgba(255, 255, 255, 0.7), 
                inset 0 -2px 4px rgba(255, 255, 255, 0.1);     

            transform: translate(-50%, 30px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: none;
        }

        .question-box.show { display: block; opacity: 1; transform: translate(-50%, 0) scale(1); }
        .question-box.hide { opacity: 0; transform: translate(-50%, -30px) scale(0.95); }
        
        #question-text { 
            color: #ffffff; 
            font-size: 1.3vw; 
            font-weight: 700; 
            margin: 0; 
            line-height: 1.5; 
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div class="ratio-16-9">
        <video id="bg-video" autoplay loop muted playsinline preload="auto">
            <source src="./bgt.mp4" type="video/mp4">
        </video>

        <div class="notif-popup" id="notif-box">
            <div class="notif-icon">🔔</div>
            <p class="notif-content">Bạn vừa nhận được 01 câu hỏi mới từ người tham gia</p>
        </div>
        <div class="question-box" id="q-box">
            <p id="question-text"></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('bg-video');
        video.addEventListener('pause', function() {
            if (!video.ended) {
                video.play().catch(() => {});
            }
        });

        const firebaseConfig = {
            databaseURL: "https://talkshow-d92b4-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const qBox = document.getElementById('q-box');
        const qText = document.getElementById('question-text');
        const notifBox = document.getElementById('notif-box');
        let currentTop = 55;

        db.ref('control').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const action = data.action;
            const msg = data.text !== undefined ? data.text : "";

            if (action === "notification") {
                triggerNotification();
                return;
            }
            if (action === "move_up") {
                currentTop -= 2;
                qBox.style.top = currentTop + "%";
                return;
            }
            if (action === "move_down") {
                currentTop += 2;
                qBox.style.top = currentTop + "%";
                return;
            }

            if (msg === "") {
                qBox.classList.remove('show');
                qBox.classList.add('hide');
                setTimeout(() => { qBox.style.display = 'none'; }, 600);
                return;
            }

            if (qBox.classList.contains('show')) {
                qBox.classList.remove('show');
                qBox.classList.add('hide');
                setTimeout(() => {
                    qText.innerText = msg;
                    qBox.classList.remove('hide');
                    qBox.classList.add('show');
                }, 600);
            } else {
                qBox.style.display = 'block';
                qText.innerText = msg;
                setTimeout(() => {
                    qBox.classList.remove('hide');
                    qBox.classList.add('show');
                }, 50);
            }
        });

        function triggerNotification() {
            notifBox.classList.add('active');
            setTimeout(() => {
                notifBox.classList.remove('active');
            }, 5000);
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
